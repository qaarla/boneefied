<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Face and neck muscles, right lateral view</title>
<desc>Right lateral view of head and neck, face toward the viewer's right. Rings of orbicularis oculi and oris, frontalis, temporalis and masseter, buccinator, platysma over the anterior neck, sternocleidomastoid, and scalenes deep in the posterior triangle.</desc>
