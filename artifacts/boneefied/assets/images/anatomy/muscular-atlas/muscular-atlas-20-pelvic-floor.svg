<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Pelvic floor: levator ani, superior view</title>
<desc>Pelvic floor seen from above, anterior (pubic symphysis) at the top. Pubococcygeus forms the medial band running from the pubis back toward the coccyx beside the midline hiatus; iliococcygeus is the thinner lateral sheet. The levator ani group pin sits on the posterior sling region between the two bands.</desc>
