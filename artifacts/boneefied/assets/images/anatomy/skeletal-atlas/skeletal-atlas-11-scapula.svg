<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Right scapula: anterior (left) and posterior (right)</title>
<desc>Right scapula twice. Anterior view: glenoid cavity toward the viewer's left, coracoid process projecting forward. Posterior view: glenoid toward the viewer's right, with the scapular spine ending in the acromion. The spine is posterior only; the coracoid is anterior.</desc>
