<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Rib detail: head, tubercle and costal groove</title>
<desc>Left panel: posterior end of a right rib from behind (patient right = viewer right, so the spine is at the viewer's left) meeting a thoracic vertebra. Right panel: the same rib seen from its inner surface, with the costal groove along the lower border.</desc>
