<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Right leg, anterior view, with tibial-plateau inset</title>
<desc>Right tibia (medial, viewer's right) and fibula (lateral, viewer's left) from the front with the ankle mortise at the bottom. Inset: the tibial plateau from above (anterior at top) showing the intercondylar eminence between the two articular surfaces; patella omitted.</desc>
