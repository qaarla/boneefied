<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Pectoral girdle relationships, anterior view (right side detailed)</title>
<desc>Anterior view. Patient right is on the viewer's left and is drawn in detail: clavicle from manubrium to acromion, acromioclavicular ligament, coracoid process below the clavicle, scapula behind, glenoid cavity and the humeral head. The left clavicle is shown plain.</desc>
