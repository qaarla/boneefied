<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Major body cavities with serous-space inset</title>
<desc>Lateral section facing viewer-left: cranial, vertebral, thoracic, abdominal and pelvic cavities, the diaphragm and a retroperitoneal kidney. The circular inset enlarges the pleural layers: lung, visceral pleura, thin pleural cavity, parietal pleura and chest wall. Spaces are tinted regions; organs are separate shapes.</desc>
