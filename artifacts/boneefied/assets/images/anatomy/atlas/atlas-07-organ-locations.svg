<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1450 1000" width="1450" height="1000">
<title>Whole-body organ locations</title>
<desc>Anterior view of the major organs in place. Liver on the patient's right (viewer left); stomach and spleen on the patient's left; heart left of midline with its apex to the viewer's right; kidneys lie behind the abdominal organs (dashed).</desc>
