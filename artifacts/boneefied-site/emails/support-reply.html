<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Boneefied Support</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap');
    body, table, td, a { font-family: Tinos, Georgia, 'Times New Roman', serif; }
    table { border-collapse: collapse; }
    a { color: #8a570b; text-decoration: underline; }
    @media only screen and (max-width: 620px) {
      .outer { padding: 12px 8px !important; }
      .content { padding: 22px 20px !important; }
      .header { padding: 18px 20px !important; }
      .footer { padding: 16px 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f5f0e6;color:#25282a;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f5f0e6;">
    <tr>
      <td class="outer" align="center" style="padding:28px 16px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;border:1px solid #c9c1b2;">
          <tr>
            <td class="header" bgcolor="#202323" style="padding:20px 28px;border-bottom:3px solid #e6a421;background-color:#202323;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="72" valign="middle" style="width:72px;">
                    <a href="https://boneefied.com/site/" style="text-decoration:none;">
                      <img src="https://boneefied.com/site/apple-touch-icon.png" width="56" height="56" alt="Boneefied" style="display:block;width:56px;height:56px;border:0;border-radius:12px;">
                    </a>
                  </td>
                  <td valign="middle" style="font-family:Tinos,Georgia,'Times New Roman',serif;color:#f2eadb;">
                    <p style="margin:0;font-size:25px;line-height:30px;font-weight:700;">Boneefied</p>
                    <p style="margin:3px 0 0;color:#e9b95d;font-size:15px;line-height:20px;">Support</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content" bgcolor="#fffdf8" style="padding:26px 28px;background-color:#fffdf8;font-family:Tinos,Georgia,'Times New Roman',serif;color:#25282a;font-size:17px;line-height:26px;overflow-wrap:anywhere;word-break:break-word;">
              {{{REPLY_HTML}}}
              <p style="margin:22px 0 0;font-size:17px;line-height:25px;">Boneefied Support<br><a href="mailto:help@boneefied.com" style="color:#8a570b;text-decoration:underline;">help@boneefied.com</a></p>
            </td>
          </tr>
          <tr>
            <td class="footer" bgcolor="#f5f0e6" style="padding:16px 28px;border-top:1px solid #c9c1b2;background-color:#f5f0e6;font-family:Tinos,Georgia,'Times New Roman',serif;color:#69675f;font-size:14px;line-height:21px;">
              Reply to this email to continue the conversation.<br>
              <a href="https://boneefied.com/site/" style="color:#69675f;text-decoration:underline;">boneefied.com</a>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
