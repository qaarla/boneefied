<!doctype html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" style="width:100%;height:100%;margin:0;padding:0;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Boneefied Support</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap');
    html, body { width:100% !important; height:100% !important; margin:0 !important; padding:0 !important; }
    .email-background { min-height:100vh; background-position:center top; background-size:cover; background-repeat:no-repeat; }
    body, table, td, a { font-family: Tinos, Georgia, 'Times New Roman', serif; }
    table { border-collapse: collapse; }
    a { color: #e9b95d; text-decoration: underline; }
    @media only screen and (max-width: 620px) {
      .outer { padding: 12px 8px !important; }
      .content { padding: 22px 20px !important; }
      .header { padding: 18px 20px !important; }
      .footer { padding: 16px 20px !important; }
    }
  </style>
</head>
<body class="email-background" style="margin:0;padding:0;width:100%;height:100%;min-height:100vh;background-color:#202323;background-image:url('https://boneefied.com/site/assets/boneefied-dark-anatomical-material.jpg');background-image:linear-gradient(rgba(17,20,19,0.68),rgba(17,20,19,0.68)),url('https://boneefied.com/site/assets/boneefied-dark-anatomical-material.jpg');background-position:center top;background-size:cover;background-repeat:no-repeat;color:#f2eadb;-webkit-text-size-adjust:100%;">
  <!-- Outlook's Word renderer uses VML for the full email-canvas artwork. -->
  <!--[if gte mso 9]>
  <v:background fill="t">
    <v:fill type="tile" src="https://boneefied.com/site/assets/boneefied-dark-anatomical-material.jpg" color="#202323"/>
  </v:background>
  <![endif]-->
  <!-- Keep the content wrapper transparent: preview renderers may discard
       table background images while retaining an opaque background color. -->
  <table role="presentation" width="100%" height="100%" bgcolor="#202323" cellpadding="0" cellspacing="0" style="width:100%;height:100%;min-height:100vh;background-color:transparent;color:#f2eadb;">
    <tr>
      <td class="outer" align="center" valign="top" style="padding:28px 16px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;color:#f2eadb;">
          <tr>
            <td class="header" style="padding:20px 28px;border-bottom:2px solid #e6a421;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="72" valign="middle" style="width:72px;">
                    <a href="https://boneefied.com/site/" style="text-decoration:none;">
                      <img src="https://boneefied.com/site/apple-touch-icon.png" width="56" height="56" alt="Boneefied" style="display:block;width:56px;height:56px;border:0;border-radius:12px;">
                    </a>
                  </td>
                  <td valign="middle" style="font-family:Tinos,Georgia,'Times New Roman',serif;color:#f2eadb;">
                    <p style="margin:0;font-size:25px;line-height:30px;font-weight:700;">Boneefied</p>
                    <p style="margin:3px 0 0;color:#e9b95d;font-size:15px;line-height:20px;">Support</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="content" style="padding:26px 28px;font-family:Tinos,Georgia,'Times New Roman',serif;color:#f2eadb;font-size:17px;line-height:26px;overflow-wrap:anywhere;word-break:break-word;">
              {{{REPLY_HTML}}}
              <p style="margin:22px 0 0;color:#f2eadb;font-size:17px;line-height:25px;">Boneefied Support<br><a href="mailto:help@boneefied.com" style="color:#e9b95d;text-decoration:underline;">help@boneefied.com</a></p>
            </td>
          </tr>
          <tr>
            <td class="footer" style="padding:16px 28px;border-top:1px solid #7b6847;font-family:Tinos,Georgia,'Times New Roman',serif;color:#d8cdbb;font-size:14px;line-height:21px;">
              Reply to this email to continue the conversation.<br>
              <a href="https://boneefied.com/site/" style="color:#d8cdbb;text-decoration:underline;">boneefied.com</a>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
