kind = "web"
previewPath = "/site/"
title = "Boneefied Website"
description = "A small public landing page for the Boneefied anatomy study app, with a phone and QR path to open or access the internal iPhone app."
version = "1.0.0"
id = "artifacts/boneefied-site"
router = "path"

[[services]]
name = "web"
paths = [ "/site/" ]
localPort = 20970

[services.development]
run = "pnpm --filter @workspace/boneefied-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/boneefied-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/boneefied-site/dist/public"

[[services.production.rewrites]]
from = "/privacy-policy"
to = "/privacy-policy.html"

[[services.production.rewrites]]
from = "/privacy-policy/"
to = "/privacy-policy.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20970"
BASE_PATH = "/site/"
