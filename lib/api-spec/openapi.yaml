openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: downloads
    description: Workspace release downloads
paths:
  /download/boneefied-production.aab:
    get:
      operationId: downloadBoneefiedProductionBundle
      tags: [downloads]
      summary: Download the existing signed Android production bundle
      description: Development-only delivery of the exact staged AAB; unavailable in production.
      responses:
        "200":
          description: Unmodified signed Android App Bundle
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment with filename boneefied-production.aab
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Bundle unavailable or not running in development
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

